<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Guess The Number</h1>
  <div id="line"></div>
  <h3>Enter a guess between 0 to 100</h3>
  <form action="">
    <input type="number" placeholder="Enter a Number" id="enter" max="100" min="0" required>
    <br>
    <input type="submit" id="submit">
  </form>
    
    <button id="start">Start</button>
    <div id="message"></div>
    <div id="GuesstValue"></div>
    
    <script src="index.js"></script>
</body>
</html>
