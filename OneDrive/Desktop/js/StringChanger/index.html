<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StringChanger</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="main">
    <input type="text"  value="Type your sentance here" placeholder="Type your sentance here">
    <div id="output">
        <label for="">LowerCase</label>
        <span class="LowerCase"></span>
    </div>
    <div id="output">
        <label for="">UpperCase</label>
        <span class="UpperCase"></span>
    </div>
    <div id="output">
        <label for="">CamelCase</label>
        <span class="info" id="camelCase"></span>
    </div>
    <div id="output">
        <label for="">PascelCase</label>
        <span class="info" id="pascalCase"></span>
    </div>
    <div id="output">
        <label for="">SnakeCase</label>
        <span itemid="snakeCase" class="info" id="pascalCase"></span>
    </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
